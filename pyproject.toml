[project]
name = "adaptiveroute"
version = "0.1.0"
description = "Conversational replanning harness for small last-mile CVRP scenarios."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "highspy>=1.12.0",
    "langgraph>=0.2.0",
    "openpyxl>=3.1.5",
    "bcrypt>=5.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.4.0",
    "pyjwt>=2.10.0",
    "pymongo>=4.8.0",
    "pyomo>=6.9.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]
train = [
    "accelerate>=1.10.0",
    "bitsandbytes>=0.48.0",
    "datasets>=4.0.0",
    "gptqmodel>=7.3.5",
    "peft>=0.17.0",
    "torchvision>=0.28.0",
    "transformers>=4.55.0",
    "trl>=0.21.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
