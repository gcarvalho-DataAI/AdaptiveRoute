name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  fast-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run fast API and agentic tests
        run: >
          uv run pytest
          tests/test_drivers_and_planning_api.py
          tests/test_agentic_api.py
          tests/test_memory_service.py
          tests/test_agentic_routing.py
          tests/test_map_api.py

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Validate Docker Compose
        run: |
          cp .env.docker.example .env.docker
          docker compose config

  solver-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run solver authority tests in forked processes
        run: >
          uv run pytest --forked
          tests/test_pyomo_highs_solver.py
          tests/test_plan_validation.py
